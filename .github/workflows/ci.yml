# The same checks as `make check`, plus the race detector and a build of the Docker image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        run: go test -race ./...

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: npm run build (no warnings allowed)
        run: |
          npm run build 2>&1 | tee build.log
          if grep -qi warn build.log; then
            echo "The UI build printed warnings; fix them before merging."
            exit 1
          fi

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          tags: yardmaster:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name ym -p 8080:8080 -e YARDMASTER_TLS=off \
            -e YARDMASTER_ADMIN_PASSWORD=ci-password-1 yardmaster:ci
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              docker exec ym yardmaster version
              docker exec ym test -x /usr/local/bin/switchyard-server
              exit 0
            fi
            sleep 1
          done
          docker logs ym
          exit 1
